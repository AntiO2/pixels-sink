# ===== Data Source =====
sink.datasource=storage
sink.storage.loop=true
sink.datasource.rate.limit=200000
sink.datasource.rate.limit.type=guava
# 事务超时（秒）—— 避免积压死锁
transaction.timeout=300

# 提高 inflight 事务上限（默认 1000，你的 activeTxNum 已经撞了）
sink.retina.trans.limit=100000
sink.retina.rpc.limit=100000

# 批次事务请求（提高吞吐）
sink.retina.trans.request.batch=true
sink.retina.trans.request.batch.size=100

# 提交参数（参考 AWS 配置）
sink.commit.method=async
sink.commit.batch.size=200
sink.commit.batch.worker=4
sink.commit.batch.delay=10

sink.monitor.report.file=./log/rate_hybench_sf100.csv
sink.monitor.freshness.file=./log/freshness_sf100.csv
# ===== Sink Mode: Retina =====
sink.mode=retina
sink.retina.embedded=false
sink.retina.mode=stream
sink.retina.client=8
sink.retina.log.queue=false

# ===== Transaction =====
sink.trans.mode=batch
sink.commit.method=async
sink.commit.batch.size=10
sink.commit.batch.worker=4
sink.commit.batch.delay=10

# ===== Retina Remote (→ cds19) =====
sink.remote.host=10.77.110.34
sink.remote.port=29422
sink.timeout.ms=5000
sink.flush.interval.ms=5
sink.flush.batch.size=100
sink.max.retries=3

# ===== Proto Files =====
sink.proto.dir=file:///data/cdc_proto/hybench/
sink.proto.data=hybench100
sink.proto.maxRecords=100000
sink.recovery.enable=false
# ===== Freshness Monitor (Trino → cds26) =====
trino.url=jdbc:trino://10.77.110.31:8080/pixels/pixels_bench_sf100x
trino.user=pixels
trino.password=password
trino.parallel=1
sink.monitor.freshness.level=embed
#sink.monitor.freshness.level=none
sink.monitor.freshness.verbose=true
sink.monitor.freshness.embed.tablelist=loanapps,loantrans

# ===== Reports =====
sink.monitor.report.enable=true
sink.monitor.report.interval=5000

# ===== Metrics =====
sink.monitor.enable=true
sink.monitor.port=9464
